name: BV Monitor
on:
  schedule:
    - cron: "*/5 7-16 * * 1-5"   # every 5 minutes, 8am-6pm UK time (7am-4pm UTC), Mon-Fri
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only (skip the BV list check)"
        type: boolean
        default: false
  repository_dispatch:
    types: [run-bv-monitor]  # triggered externally by cron-job.org / EasyCron for reliable timing
concurrency:
  group: bv-monitor
  cancel-in-progress: false   # let the current run finish rather than killing it mid-way
jobs:
  check-bv-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Run BV monitor
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # EMAIL_FROM: ${{ secrets.EMAIL_FROM }}   # optional — script falls back to admin@family-wise.co.uk
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python bv_monitor.py --test-email
          else
            python bv_monitor.py
          fi
      - name: Commit updated saved list and log
        if: ${{ inputs.test_email != true }}
        run: |
          git config --global user.name "bv-monitor-bot"
          git config --global user.email "bv-monitor-bot@users.noreply.github.com"
          git add bv_saved_list.csv bv_monitor.log
          git diff --staged --quiet && exit 0
          git commit -m "Update BV saved list [skip ci]"
          git pull --rebase origin main
          git push
