name: BV Monitor

on:
  schedule:
    - cron: "*/5 7-16 * * 1-5"   # every 5 minutes, 8am-6pm UK time (7am-4pm UTC), Mon-Fri
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab too
  repository_dispatch:
    types: [run-bv-monitor]  # triggered externally by cron-job.org / EasyCron for reliable timing

jobs:
  check-bv-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Run BV monitor
        run: python bv_monitor.py

      - name: Commit updated saved list and log
        run: |
          git config --global user.name "bv-monitor-bot"
          git config --global user.email "bv-monitor-bot@users.noreply.github.com"
          git add bv_saved_list.csv bv_monitor.log
          git diff --staged --quiet || git commit -m "Update BV saved list [skip ci]"
          git push
